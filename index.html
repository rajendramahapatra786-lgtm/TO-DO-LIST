<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Todo App</title>
  <link rel="stylesheet" href="index.css" />
</head>
<body>

  <!-- TOP RIBBON -->
  <div class="ribbon">Daily To Do List</div>

  <!-- BACKGROUND -->
  <img src="fuck off.jpeg" class="bg-img" alt="bg" />
  <div class="overlay"></div>

  <!-- APP -->
  <div class="app">

    <!-- HEADER -->
    <header class="header">
      <h1 id="greeting">👋 Hello</h1>
      <p id="headerQuote"></p>
    </header>

    <!-- MOTIVATION -->
    <div class="motivation">
      <h2 id="motivationText"></h2>
    </div>

    <!-- TASK LIST -->
    <div id="taskList" class="task-list"></div>

    <!-- ADD BUTTON -->
    <button id="addTaskBtn" class="fab" aria-label="Add task">+</button>

  </div>

  <script src="index.js"></script>
</body>
</html>
