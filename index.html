<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/notification.css">
</head>

<body>

  <!-- TOP RIBBON -->
  <div class="ribbon">Daily To Do List</div>

  <select id="themeSwitcher">
    <option value="dark">Dark</option>
    <option value="light">Light</option>
    <option value="rgb">RGB</option>
    <option value="neon">Neon</option>
  </select>

  <!-- BACKGROUND -->
  <img src="assets/images/bg_2.jpeg" class="bg-img" alt="bg">
  <div class="overlay"></div>

  <!-- APP -->
  <div class="app fade-in">

    <!-- HEADER -->
    <header class="header">
      <h1 id="greeting">👋 Hello</h1>
      <p id="headerQuote"></p>
    </header>

    <!-- MOTIVATION -->
    <div class="motivation">
      <h2 id="motivationText"></h2>
    </div>

    <!-- SEARCH -->

    <input type="text" id="searchTask" placeholder="Search task, category, date...">

    <!-- TASK LIST -->
    <div id="taskList" class="task-list"></div>

    <button id="musicBtn">🎵 </button>

    <audio id="bg-music" src="assets/audio/music.mp3" loop></audio> <!-- ADD BUTTON -->
    <button id="addTaskBtn" class="fab" aria-label="Add task">+</button>

  </div>

  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/notification.js"></script>
  <script src="js/theme.js"></script>

  <script src="js/index.js"></script>
</body>

</html>
