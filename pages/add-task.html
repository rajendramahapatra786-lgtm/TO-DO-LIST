<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add New Task</title>
  <link rel="stylesheet" href="../css/add-task.css">
  <link rel="stylesheet" href="../css/themes.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/notification.css">
</head>

<body>

  <!-- BACK BUTTON -->
  <button type="button" class="back-btn" onclick="history.back()">
    <i class="fa-solid fa-arrow-left"></i>
    <span>Back</span>
</button>

  <img src="../assets/images/bg_1.jpeg" class="bg-img" alt="">
  <div class="overlay"></div>

<div class="page fade-in">
      <div class="top-bar">
      <h2>Add New Task</h2>
    </div>

    <div class="scroll-area">

      <!-- AVATAR -->
      <div class="avatar">
        <div id="taskEmoji" class="avatar-circle">🙂</div>
        <div class="edit-emoji" onclick="toggleEmojiBar()">✏️</div>
      </div>

      <!-- EMOJI BAR -->
      <div id="emojiBar" class="emoji-bar hidden">
        <div class="emoji-categories">
          <button type="button" onclick="showCategory('smileys')">😀 Smileys</button>
          <button type="button" onclick="showCategory('exercise')">🏋️ Exercise</button>
          <button type="button" onclick="showCategory('study')">📚 Study</button>
        </div>
        <div id="emojiGrid" class="emoji-grid"></div>
      </div>

      <!-- FORM -->
      <form class="task-form">

        <!-- TASK NAME -->
        <div class="float-field">
          <input id="taskName" type="text" placeholder=" " required>
          <label>Task Name *</label>
        </div>

        <!-- TASK DESCRIPTION -->
        <div class="float-field">
          <textarea id="taskDesc" placeholder=" "></textarea>
          <label>Task Description</label>
        </div>

        <!-- DEADLINE -->
        <div class="float-field">
          <input id="taskDeadline" type="datetime-local" placeholder=" ">
          <label>Task Deadline</label>
        </div>

        <!-- CATEGORY -->
        <label class="normal-label">Category</label>
        <div class="category-wrapper">

          <div class="category-box" id="categoryInput">
            <span id="categoryText">Select Categories</span>
            <span>⌄</span>
          </div>

          <div class="category-dropdown" id="categoryDropdown">
            <div class="category-header">
              <strong>Select Categories (max 3)</strong><br>
              <small>Selected: <span id="selectedCount">none</span></small>
            </div>

            <div class="category-scroll">
              <!-- categories injected by JS -->

              <!-- MODIFY BUTTON (ONLY BUTTON LOGIC USED) -->
              <button type="button" class="modify-btn" onclick="goToCategories()">
                ✏ MODIFY CATEGORIES
              </button>
            </div>
          </div>
        </div>

        <!-- COLOR -->
        <label class="normal-label">Color</label>
        <div class="color-wrapper">
          <div class="color-box" id="colorInput">
            <div class="color-left">
              <span class="color-preview violet" id="colorPreview"></span>
              <span id="colorText">Color – Electric Violet</span>
            </div>
            <span>⌄</span>
          </div>

          <div class="color-dropdown" id="colorDropdown">
            <div class="color-grid">
              <div class="color-dot violet" data-name="Electric Violet"></div>
              <div class="color-dot pink" data-name="Pink"></div>
              <div class="color-dot blue" data-name="Blue"></div>
              <div class="color-dot green" data-name="Green"></div>
              <div class="color-dot yellow" data-name="Yellow"></div>
              <div class="color-dot orange" data-name="Orange"></div>
              <div class="color-dot red" data-name="Red"></div>
            </div>
          </div>
        </div>

        <button type="button" class="create-btn">Create Task</button>

      </form>
    </div>
  </div>
  <audio id="bg-music" src="../assets/audio/music.mp3" loop></audio>
  <!-- <script src="../js/index.js"></script> -->

<script src="../js/utils.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/notification.js"></script>
<script src="../js/theme.js"></script>

<script src="../js/add-task.js"></script>


</body>
</html>
