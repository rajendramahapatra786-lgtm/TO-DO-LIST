<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Task Details</title>
  <link rel="stylesheet" href="task.css" />
</head>
<body>

  <!-- TOP BAR -->
  <div class="task-top">
    <button class="back-btn" onclick="goBack()">←</button>
    <h2 id="taskTitle">Task</h2>
    <div class="actions">
      <button id="editBtn">✏️</button>
      <button id="deleteBtn">🗑️</button>
    </div>
  </div>

  <!-- TASK INFO -->
  <div class="task-container">
    <p id="taskDesc"></p>
    <p id="taskDeadline"></p>
    <div id="taskCategories" class="task-cats"></div>
  </div>

  <!-- WEEKLY TRACKER -->
  <div class="month-wrapper">
    <div id="weeksContainer"></div>
  </div>

  <!-- PROGRESS GRAPH -->
  <div class="progress-wrapper">
    <h3>Monthly Progress</h3>
    <div id="progressBars" class="progress-bars"></div>
  </div>

  <!-- EDIT MODAL -->
  <div id="modalOverlay" class="modal-overlay">
    <div class="modal">
      <h3>Edit Task</h3>

      <label>Task Name</label>
      <input id="editName" type="text" />

      <label>Description</label>
      <textarea id="editDesc"></textarea>

      <label>Deadline</label>
      <input id="editDeadline" type="datetime-local" />

      <label>Color</label>
      <select id="editColor">
        <option value="#22c55e">Green</option>
        <option value="#6366f1">Violet</option>
        <option value="#0ea5e9">Blue</option>
        <option value="#f97316">Orange</option>
        <option value="#ef4444">Red</option>
      </select>

      <div class="modal-actions">
        <button id="cancelEdit">Cancel</button>
        <button id="saveEdit">Save</button>
      </div>
    </div>
  </div>

  <script src="task.js"></script>
</body>
</html>
